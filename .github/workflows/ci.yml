name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.12.1"
  DATABASE_URL: postgresql://factosys:factosys@localhost:5432/factosys
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-test-jwt-access-secret-32b
  MINIO_ENDPOINT: http://localhost:9000
  MINIO_ACCESS_KEY: factosys
  MINIO_SECRET_KEY: factosysdev
  MINIO_BUCKET: factosys-dev
  MINIO_REGION: us-east-1
  CREDENTIALS_MASTER_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
  SUNAT_BILL_MODE: fake

jobs:
  lint-test-build:
    name: lint · test · build · xsd+excel-gate · db-migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factosys
          POSTGRES_PASSWORD: factosys
          POSTGRES_DB: factosys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factosys -d factosys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: factosys
          MINIO_ROOT_PASSWORD: factosysdev
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache XSD unpack
        uses: actions/cache@v4
        with:
          path: packages/sunat-validation/.cache/xsd-ubl
          key: xsd-ubl-${{ hashFiles('docs/sunat-oficial/04-esquemas-validacion/xsd-ubl.zip') }}

      - name: Unpack SUNAT XSD schemas
        run: pnpm sunat:unpack-schemas

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: DB migrate up → down → up
        run: |
          pnpm db:migrate
          pnpm --filter @factosys/db migrate:down -- --all
          pnpm db:migrate
          pnpm db:seed

      - name: Test
        run: pnpm test

      - name: XSD + Excel P0 gate (golden Invoice 01)
        run: pnpm validate:xml --type=01 --stages=xsd,excel packages/sunat-ubl/testdata/golden/01-invoice-gravada.unsigned.xml

      - name: XSD + Excel P1 gate (golden Boleta 03)
        run: pnpm validate:xml --type=03 --stages=xsd,excel packages/sunat-ubl/testdata/golden/03-receipt-dni.unsigned.xml

      - name: XSD + Excel P2 gate (golden NC 07)
        run: pnpm validate:xml --type=07 --stages=xsd,excel packages/sunat-ubl/testdata/golden/07-credit-note-void.unsigned.xml

      - name: XSD + Excel P2 gate (golden ND 08)
        run: pnpm validate:xml --type=08 --stages=xsd,excel packages/sunat-ubl/testdata/golden/08-debit-note-interest.unsigned.xml
